[package]
name = "ekko"
version = "0.1.0"
edition = "2021"
description = "Tasks, boards & notes for the command-line habitat"
license = "MIT"

[[bin]]
name = "ekko"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
chrono = "0.4"
libc = "0.2"

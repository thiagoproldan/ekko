[package]
name = "ekko"
version = "0.37.0"
edition = "2021"
rust-version = "1.88"
description = "Tasks, boards & notes for the command-line habitat"
license = "MIT AND OFL-1.1"
repository = "https://github.com/thiagoproldan/ekko"
readme = "readme.md"
keywords = ["task", "todo", "notes", "board", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ekko"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: board/date names must keep discovery order in --json
# output (an object's key order is significant here), not fall back to
# serde_json's default alphabetical BTreeMap ordering.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
libc = "0.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# The plan on an artifact's page, from Markdown (task 1019): the HTML
# renderer alone, without the command-line tool's getopts.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The head of each request `ekko serve` answers (task 1102): hyper's parser,
# with no dependencies, for 25 kB of a stripped build (decision 1128).
httparse = "1"
